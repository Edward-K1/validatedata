[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validatedata"
version = "0.7.2"
authors = [
  { name="Edward Kigozi", email="eddyk1collab@gmail.com" },
]
description = "Lightning-fast validation in python."
readme = "README.md"
# Updated to the new SPDX string format to silence warnings
license = "MIT"
requires-python = ">=3.8"

keywords = ["validate", "data", "validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Edward-K1/validatedata"
Repository = "https://github.com/Edward-K1/validatedata.git"
Issues = "https://github.com/Edward-K1/validatedata/issues"
Documentation = "https://validatedata.readthedocs.io"

[project.optional-dependencies]
dates = ["python-dateutil"]

[tool.setuptools]
packages = ["validatedata"]
